[workspace]
authors = ["FahirahD <fahirah.diarra@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "hello-world"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
parse-legislation = "mojo run src/legislation_parser.mojo"
parse-jurisprudence = "mojo run src/jurisprudence_parser.mojo"
parse-doctrine = "mojo run src/doctrine_parser.mojo"
test-legislation = "mojo run src/test_legislation_parser.mojo"
test-jurisprudence = "mojo run src/test_jurisprudence_parser.mojo"
test-doctrine = "mojo run src/test_doctrine_parser.mojo"
test-legislation-integration = "mojo run src/test_legislation_integration.mojo"
test-jurisprudence-integration = "mojo run src/test_jurisprudence_integration.mojo"
test-doctrine-integration = "mojo run src/test_doctrine_integration.mojo"
test = "mojo run src/test_legislation_parser.mojo && mojo run src/test_jurisprudence_parser.mojo && mojo run src/test_doctrine_parser.mojo"
test-integration = "mojo run src/test_legislation_integration.mojo && mojo run src/test_jurisprudence_integration.mojo && mojo run src/test_doctrine_integration.mojo"
test-all = "mojo run src/test_legislation_parser.mojo && mojo run src/test_jurisprudence_parser.mojo && mojo run src/test_doctrine_parser.mojo && mojo run src/test_legislation_integration.mojo && mojo run src/test_jurisprudence_integration.mojo && mojo run src/test_doctrine_integration.mojo"
bench-legislation = "mojo run src/bench_legislation_parser.mojo"
bench-jurisprudence = "mojo run src/bench_jurisprudence_parser.mojo"
bench-doctrine = "mojo run src/bench_doctrine_parser.mojo"
bench = "mojo run src/bench_legislation_parser.mojo && mojo run src/bench_jurisprudence_parser.mojo && mojo run src/bench_doctrine_parser.mojo"

[dependencies]
mojo = ">=1.0.0,<2"
